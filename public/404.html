<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bonsai Café</title>
    <script>
      // Single Page Apps for GitHub Pages — redirects a deep link (e.g. /admin)
      // through a query string so index.html can restore it on load.
      var pathSegmentsToKeep = 1; // "/bonsai-cafe"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
