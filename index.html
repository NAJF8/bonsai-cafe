<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/brand/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A3B31" />
    <meta name="description" content="بونساي كافيه — قهوة مختصة تنبض بالتفاصيل. تصفح المنيو الإلكتروني واطلب مباشرة عبر واتساب." />
    <title>Bonsai Café | بونساي كافيه — المنيو</title>
    <script>
      // Restores a deep link (e.g. /admin) that 404.html redirected through
      // a query string, for the GitHub Pages SPA fallback — a no-op on Vercel.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("bonsai_theme") || "system";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref;
          document.documentElement.dataset.theme = resolved;
          var lang = localStorage.getItem("bonsai_lang") || "ar";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body dir="rtl">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
